<div class="p-6 transition-all duration-300" [class.px-5]="layoutService.isSidebarCollapsed()">
  <div class="flex items-center gap-3">
    <span class="text-xl font-bold tracking-tight text-text whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      MediAdmin
    </span>
  </div>
</div>

<nav class="flex-1 px-4 pb-4 space-y-1 overflow-y-auto overflow-x-hidden">
  <div class="text-xs font-semibold text-text-muted uppercase tracking-wider mb-2 mt-4 px-2 whitespace-nowrap overflow-hidden transition-all duration-300"
    [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
    [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
    Main
  </div>
  
  <a routerLink="/" (click)="testNavigate('/', $event)" routerLinkActive="bg-primary/10 text-primary" [routerLinkActiveOptions]="{exact: true}" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Dashboard
    </span>
  </a>

  <a routerLink="/patients" (click)="testNavigate('/patients', $event)" routerLinkActive="bg-primary/10 text-primary" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Patients
    </span>
  </a>

  <a routerLink="/appointments" (click)="testNavigate('/appointments', $event)" routerLinkActive="bg-primary/10 text-primary" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Appointments
    </span>
  </a>

  <a routerLink="/consultations" (click)="testNavigate('/consultations', $event)" routerLinkActive="bg-primary/10 text-primary" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Teleconsultation
    </span>
  </a>

  <a routerLink="/reports" (click)="testNavigate('/reports', $event)" routerLinkActive="bg-primary/10 text-primary" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Reports
    </span>
  </a>

  <div class="text-xs font-semibold text-text-muted uppercase tracking-wider mb-2 mt-8 px-2 whitespace-nowrap overflow-hidden transition-all duration-300"
    [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
    [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
    Support
  </div>

  <a routerLink="/settings" (click)="testNavigate('/settings', $event)" routerLinkActive="bg-primary/10 text-primary" 
    class="flex items-center gap-3 px-2 py-2.5 rounded-lg text-text-secondary hover:bg-surface hover:text-primary font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Settings
    </span>
  </a>
</nav>

<div class="p-4 border-t border-border mt-auto">
  <button class="flex items-center gap-3 px-2 py-2.5 w-full rounded-lg text-danger hover:bg-danger/10 font-medium transition-all duration-300 group overflow-hidden">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
    </svg>
    <span class="whitespace-nowrap overflow-hidden transition-all duration-300"
      [style.max-width]="layoutService.isSidebarCollapsed() ? '0px' : '200px'"
      [style.opacity]="layoutService.isSidebarCollapsed() ? '0' : '1'">
      Logout
    </span>
  </button>
</div>
