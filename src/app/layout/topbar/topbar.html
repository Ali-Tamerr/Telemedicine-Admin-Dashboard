<!-- Sidebar Toggle -->
<button (click)="layoutService.toggleSidebar()" class="p-2 mr-2 text-text-muted hover:text-primary transition-colors rounded-lg hover:bg-surface focus:outline-none">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

<div class="flex-1"></div>

<!-- Actions -->
<div class="flex items-center gap-4">
  <button (click)="themeService.toggleTheme()" class="p-2 text-text-muted hover:text-primary transition-colors rounded-full hover:bg-surface focus:outline-none">
    @if (themeService.isDarkMode()) {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    }
  </button>

  <div class="relative">
    <button (click)="toggleNotifications()" class="relative p-2 text-text-muted hover:text-primary transition-colors rounded-full hover:bg-surface focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-danger border-2 border-topbar-bg rounded-full"></span>
    </button>

    <!-- Notifications Dropdown -->
    @if (showNotifications()) {
      <div class="absolute right-0 mt-2 w-80 bg-surface border border-border rounded-xl shadow-xl overflow-hidden z-50 animate-in fade-in slide-in-from-top-2 duration-200">
        <div class="p-4 border-b border-border flex items-center justify-between bg-bg/50">
          <h3 class="font-bold text-text">Notifications</h3>
          <span class="text-xs bg-primary/10 text-primary px-2 py-0.5 rounded-full font-medium">2 New</span>
        </div>
        <div class="max-h-96 overflow-y-auto">
          @for (note of notifications; track note.id) {
            <div class="p-4 border-b border-border/50 hover:bg-bg/30 transition-colors cursor-pointer group">
              <div class="flex justify-between items-start mb-1">
                <span class="text-sm font-bold text-text group-hover:text-primary transition-colors">{{ note.title }}</span>
                <span class="text-[10px] text-text-muted">{{ note.time }}</span>
              </div>
              <p class="text-xs text-text-secondary leading-relaxed">{{ note.message }}</p>
              @if (note.unread) {
                <div class="mt-2 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 bg-primary rounded-full"></span>
                  <span class="text-[10px] text-primary font-medium">New</span>
                </div>
              }
            </div>
          }
        </div>
        <div class="p-3 text-center bg-bg/50 border-t border-border">
          <button class="text-xs font-bold text-primary hover:underline">Mark all as read</button>
        </div>
      </div>
    }
  </div>
  
  <div class="flex items-center gap-3 border-l border-border pl-4">
    <div class="text-right hidden sm:block">
      <div class="text-sm font-semibold text-text">Dr. Sarah Jenkins</div>
      <div class="text-xs text-text-muted">Chief Medical Officer</div>
    </div>
    <div class="h-10 w-10 rounded-full bg-secondary flex items-center justify-center text-white font-bold shadow-sm">
      SJ
    </div>
  </div>
</div>
