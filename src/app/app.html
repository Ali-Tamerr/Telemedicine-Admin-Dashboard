<div class="flex h-screen bg-bg text-text font-sans antialiased">
  <!-- Sidebar -->
  <app-sidebar 
    [class.w-64]="!layoutService.isSidebarCollapsed()" 
    [class.w-20]="layoutService.isSidebarCollapsed()" 
    class="hidden md:flex flex-col bg-sidebar-bg border-r border-border shadow-sm z-50 transition-all duration-300">
  </app-sidebar>

  <div class="flex flex-col flex-1 overflow-hidden relative z-0">
    <!-- Topbar -->
    <app-topbar class="flex items-center justify-between h-16 bg-topbar-bg border-b border-border shadow-sm px-6 z-40"></app-topbar>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6 bg-bg flex flex-col">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
