<div class="space-y-6 max-w-5xl">
  <div>
    <h1 class="text-2xl font-bold text-text">Platform Settings</h1>
    <p class="text-sm text-text-muted mt-1">Manage your admin preferences and system configurations.</p>
  </div>

  <div class="bg-surface rounded-xl shadow-sm border border-border flex flex-col md:flex-row overflow-hidden">
    <!-- Settings Sidebar -->
    <div class="w-full md:w-64 bg-bg/30 border-r border-border flex flex-col">
      <nav class="flex flex-row md:flex-col p-4 gap-1 overflow-x-auto">
        <button class="px-4 py-2.5 text-sm font-semibold text-primary bg-primary/10 rounded-lg flex items-center gap-3 text-left w-full whitespace-nowrap">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Account Profile
        </button>
        <button class="px-4 py-2.5 text-sm font-medium text-text-muted hover:bg-bg/50 hover:text-text rounded-lg flex items-center gap-3 text-left w-full whitespace-nowrap transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          Notifications
        </button>
        <button class="px-4 py-2.5 text-sm font-medium text-text-muted hover:bg-bg/50 hover:text-text rounded-lg flex items-center gap-3 text-left w-full whitespace-nowrap transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          Security
        </button>
        <button class="px-4 py-2.5 text-sm font-medium text-text-muted hover:bg-bg/50 hover:text-text rounded-lg flex items-center gap-3 text-left w-full whitespace-nowrap transition-all">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          System Preferences
        </button>
      </nav>
    </div>

    <!-- Settings Content -->
    <div class="flex-1 p-6 sm:p-8 space-y-8 bg-surface">
      <div>
        <h2 class="text-lg font-semibold text-text border-b border-border pb-2 mb-6">Profile Information</h2>
        
        <div class="flex items-center gap-6 mb-8">
          <div class="h-20 w-20 rounded-full bg-primary text-white flex items-center justify-center text-2xl font-bold shadow-md">
            AM
          </div>
          <div>
            <button class="px-4 py-2 border border-border rounded-lg text-sm font-medium text-text hover:bg-bg/50 transition-colors">Change Photo</button>
            <p class="text-xs text-text-muted mt-2">JPG, GIF or PNG. Max size of 800K</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="space-y-1">
            <label class="text-sm font-medium text-text-secondary">First Name</label>
            <input type="text" value="Admin" class="block w-full px-4 py-2 border border-border rounded-lg text-sm focus:ring-primary focus:border-primary bg-bg/50 text-text">
          </div>
          <div class="space-y-1">
            <label class="text-sm font-medium text-text-secondary">Last Name</label>
            <input type="text" value="Manager" class="block w-full px-4 py-2 border border-border rounded-lg text-sm focus:ring-primary focus:border-primary bg-bg/50 text-text">
          </div>
          <div class="space-y-1 sm:col-span-2">
            <label class="text-sm font-medium text-text-secondary">Email Address</label>
            <input type="email" value="admin@telemed.com" class="block w-full px-4 py-2 border border-border rounded-lg text-sm focus:ring-primary focus:border-primary bg-bg/50 text-text">
          </div>
          <div class="space-y-1 sm:col-span-2">
            <label class="text-sm font-medium text-text-secondary">Role / Designation</label>
            <input type="text" value="Chief Medical Administrator" disabled class="block w-full px-4 py-2 border border-border bg-bg/30 text-text-muted rounded-lg text-sm cursor-not-allowed">
          </div>
        </div>
      </div>

      <div class="pt-6 border-t border-border flex justify-end gap-3">
        <button class="px-5 py-2.5 text-sm font-medium text-text-muted hover:bg-bg/50 rounded-lg transition-colors">Discard</button>
        <button class="px-6 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-all shadow-sm">Save Changes</button>
      </div>
    </div>
  </div>
</div>
