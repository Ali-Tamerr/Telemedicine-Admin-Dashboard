<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-text">Appointment Scheduling</h1>
      <p class="text-sm text-text-muted mt-1">Manage and schedule patient consultations.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex bg-bg/50 p-1 rounded-lg border border-border">
        <button class="px-3 py-1.5 text-sm font-medium rounded-md bg-surface text-text shadow-sm">Week</button>
        <button class="px-3 py-1.5 text-sm font-medium rounded-md text-text-muted hover:text-text transition-colors">Month</button>
      </div>
      <button class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors shadow-sm focus:ring-2 focus:ring-primary focus:ring-offset-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Book Appointment
      </button>
    </div>
  </div>

  <div class="bg-surface p-6 rounded-xl shadow-sm border border-border">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold text-text flex items-center gap-2">
        <button class="p-1 hover:bg-bg/50 rounded text-text-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        May 11 - 17, 2026
        <button class="p-1 hover:bg-bg/50 rounded text-text-muted transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </h2>
      <div class="flex gap-4 text-sm font-medium">
        <span class="flex items-center gap-2 text-text-secondary"><div class="w-3 h-3 rounded-full bg-primary"></div> Routine</span>
        <span class="flex items-center gap-2 text-text-secondary"><div class="w-3 h-3 rounded-full bg-danger"></div> Urgent</span>
        <span class="flex items-center gap-2 text-text-secondary"><div class="w-3 h-3 rounded-full bg-warning"></div> Follow-up</span>
      </div>
    </div>

    <!-- Reusing the calendar grid from dashboard for consistency -->
    <app-appointment-calendar></app-appointment-calendar>
  </div>
</div>
