<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-[#134e4a]">Appointment Scheduling</h1>
      <p class="text-sm text-gray-500 mt-1">Manage and schedule patient consultations.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex bg-gray-100 p-1 rounded-lg">
        <button class="px-3 py-1.5 text-sm font-medium rounded-md bg-white text-[#134e4a] shadow-sm">Week</button>
        <button class="px-3 py-1.5 text-sm font-medium rounded-md text-gray-500 hover:text-[#134e4a]">Month</button>
      </div>
      <button class="flex items-center gap-2 px-4 py-2 bg-[#0891b2] text-white rounded-lg hover:bg-[#067a96] transition-colors shadow-sm focus:ring-2 focus:ring-[#0891b2] focus:ring-offset-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Book Appointment
      </button>
    </div>
  </div>

  <div class="bg-white p-6 rounded-xl shadow-sm border border-teal-50">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold text-[#134e4a] flex items-center gap-2">
        <button class="p-1 hover:bg-gray-100 rounded text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        May 11 - 17, 2026
        <button class="p-1 hover:bg-gray-100 rounded text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </h2>
      <div class="flex gap-4 text-sm font-medium">
        <span class="flex items-center gap-2 text-gray-600"><div class="w-3 h-3 rounded-full bg-[#0891b2]"></div> Routine</span>
        <span class="flex items-center gap-2 text-gray-600"><div class="w-3 h-3 rounded-full bg-[#ef4444]"></div> Urgent</span>
        <span class="flex items-center gap-2 text-gray-600"><div class="w-3 h-3 rounded-full bg-[#f59e0b]"></div> Follow-up</span>
      </div>
    </div>

    <!-- Reusing the calendar grid from dashboard for consistency -->
    <app-appointment-calendar></app-appointment-calendar>
  </div>
</div>
