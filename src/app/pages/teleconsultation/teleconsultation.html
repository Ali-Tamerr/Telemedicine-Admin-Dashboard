<div class="h-[calc(100vh-6rem)] flex flex-col -mx-6 -mt-6">
  <!-- Telehealth Header -->
  <div class="bg-white border-b border-teal-100 px-6 py-4 flex justify-between items-center shrink-0">
    <div>
      <h1 class="text-xl font-bold text-[#134e4a] flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
        Live Consultation
      </h1>
      <p class="text-sm text-gray-500 mt-1">Patient: Robert Taylor | ID: #P-0122</p>
    </div>
    <div class="flex items-center gap-2 text-sm font-medium bg-red-50 text-red-600 px-3 py-1.5 rounded-lg border border-red-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      14:23
    </div>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Video Area -->
    <div class="flex-1 bg-gray-900 relative p-4 flex flex-col">
      <!-- Main Video (Patient) -->
      <div class="flex-1 bg-gray-800 rounded-xl overflow-hidden relative border border-gray-700 flex items-center justify-center">
        <div class="text-center text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <p>Waiting for patient video...</p>
        </div>
        <div class="absolute bottom-4 left-4 bg-black/50 text-white px-3 py-1 rounded-md text-sm font-medium backdrop-blur-sm">
          Robert Taylor
        </div>
      </div>

      <!-- Self Video Thumbnail -->
      <div class="absolute top-8 right-8 w-48 h-36 bg-gray-800 rounded-lg border-2 border-gray-600 overflow-hidden shadow-lg flex items-center justify-center">
        <div class="text-gray-400 text-sm">Camera Off</div>
      </div>

      <!-- Call Controls -->
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-gray-800/80 backdrop-blur px-6 py-3 rounded-full border border-gray-700 shadow-xl">
        <button class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-600 transition-colors focus:ring-2 focus:ring-gray-400 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
        </button>
        <button class="p-3 rounded-full bg-red-500/20 text-red-500 border border-red-500/50 hover:bg-red-500/30 transition-colors focus:ring-2 focus:ring-red-500 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
          </svg>
        </button>
        <button class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-600 transition-colors focus:ring-2 focus:ring-gray-400 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>
        <div class="w-px h-8 bg-gray-600 mx-2"></div>
        <button class="px-6 py-3 rounded-full bg-red-500 text-white font-bold tracking-wide hover:bg-red-600 transition-colors shadow-md focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-gray-900 focus:outline-none">
          End Call
        </button>
      </div>
    </div>

    <!-- Side Panel -->
    <div class="w-80 bg-white border-l border-teal-100 flex flex-col shadow-[-4px_0_15px_-3px_rgba(0,0,0,0.05)]">
      <!-- Tabs -->
      <div class="flex border-b border-gray-100 shrink-0">
        <button class="flex-1 py-3 text-sm font-bold text-[#0891b2] border-b-2 border-[#0891b2]">Patient Info</button>
        <button class="flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">Chat</button>
        <button class="flex-1 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors">Notes</button>
      </div>

      <!-- Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6">
        <div>
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Current Vitals</h3>
          <app-vital-signs-chart></app-vital-signs-chart>
        </div>
        
        <div class="border-t border-gray-100 pt-4">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Quick History</h3>
          <div class="space-y-3">
            <div class="p-3 bg-red-50 border border-red-100 rounded-lg">
              <p class="text-xs font-bold text-red-800">Alert: Elevated BP History</p>
              <p class="text-xs text-red-600 mt-1">Patient has a history of hypertensive crisis.</p>
            </div>
            <div class="p-3 bg-gray-50 border border-gray-100 rounded-lg">
              <p class="text-xs font-semibold text-gray-700">Last visit: May 08, 2026</p>
              <p class="text-xs text-gray-500 mt-1">Prescribed Lisinopril 10mg.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
