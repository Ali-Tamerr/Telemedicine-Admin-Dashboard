<div class="h-[calc(100vh-6rem)] flex flex-col -mx-6 -mt-6">
  <!-- Telehealth Header -->
  <div class="bg-surface border-b border-border px-6 py-4 flex justify-between items-center shrink-0">
    <div>
      <h1 class="text-xl font-bold text-text flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-danger animate-pulse"></span>
        Live Consultation
      </h1>
      <p class="text-sm text-text-muted mt-1">Patient: Robert Taylor | ID: #P-0122</p>
    </div>
    <div class="flex items-center gap-2 text-sm font-medium bg-danger/10 text-danger px-3 py-1.5 rounded-lg border border-danger/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      14:23
    </div>
  </div>

  <div class="flex-1 flex overflow-hidden">
    <!-- Video Area -->
    <div class="flex-1 bg-[#0f172a] relative p-4 flex flex-col">
      <!-- Main Video (Patient) -->
      <div class="flex-1 bg-black/40 rounded-xl overflow-hidden relative border border-white/10 flex items-center justify-center">
        <div class="text-center text-white/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <p>Waiting for patient video...</p>
        </div>
        <div class="absolute bottom-4 left-4 bg-black/50 text-white px-3 py-1 rounded-md text-sm font-medium backdrop-blur-sm">
          Robert Taylor
        </div>
      </div>

      <!-- Self Video Thumbnail -->
      <div class="absolute top-8 right-8 w-48 h-36 bg-gray-900 rounded-lg border-2 border-white/20 overflow-hidden shadow-lg flex items-center justify-center">
        <div class="text-white/40 text-sm">Camera Off</div>
      </div>

      <!-- Call Controls -->
      <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-4 bg-black/60 backdrop-blur-md px-6 py-3 rounded-full border border-white/10 shadow-2xl">
        <button class="p-3 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors focus:ring-2 focus:ring-white/30 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
        </button>
        <button class="p-3 rounded-full bg-danger/20 text-danger border border-danger/50 hover:bg-danger/30 transition-colors focus:ring-2 focus:ring-danger focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
          </svg>
        </button>
        <button class="p-3 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors focus:ring-2 focus:ring-white/30 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>
        <div class="w-px h-8 bg-white/10 mx-2"></div>
        <button class="px-6 py-3 rounded-full bg-danger text-white font-bold tracking-wide hover:bg-danger/90 transition-colors shadow-md focus:ring-2 focus:ring-danger focus:ring-offset-2 focus:ring-offset-gray-900 focus:outline-none">
          End Call
        </button>
      </div>
    </div>

    <!-- Side Panel -->
    <div class="w-80 bg-surface border-l border-border flex flex-col shadow-xl">
      <!-- Tabs -->
      <div class="flex border-b border-border shrink-0">
        <button class="flex-1 py-3 text-sm font-bold text-primary border-b-2 border-primary">Patient Info</button>
        <button class="flex-1 py-3 text-sm font-medium text-text-muted hover:text-text transition-colors">Chat</button>
        <button class="flex-1 py-3 text-sm font-medium text-text-muted hover:text-text transition-colors">Notes</button>
      </div>

      <!-- Content -->
      <div class="flex-1 overflow-y-auto p-4 space-y-6">
        <div>
          <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider mb-2">Current Vitals</h3>
          <app-vital-signs-chart></app-vital-signs-chart>
        </div>
        
        <div class="border-t border-border pt-4">
          <h3 class="text-xs font-bold text-text-muted uppercase tracking-wider mb-2">Quick History</h3>
          <div class="space-y-3">
            <div class="p-3 bg-danger/10 border border-danger/20 rounded-lg">
              <p class="text-xs font-bold text-danger">Alert: Elevated BP History</p>
              <p class="text-xs text-danger/80 mt-1">Patient has a history of hypertensive crisis.</p>
            </div>
            <div class="p-3 bg-bg/50 border border-border rounded-lg">
              <p class="text-xs font-semibold text-text">Last visit: May 08, 2026</p>
              <p class="text-xs text-text-muted mt-1">Prescribed Lisinopril 10mg.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
