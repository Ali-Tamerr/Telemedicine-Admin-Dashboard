<div class="space-y-4">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
    <div>
      <h1 class="text-xl font-bold text-[#134e4a]">Dashboard Overview</h1>
      <p class="text-xs text-gray-500">Welcome back, Dr. Jenkins.</p>
    </div>
    <button class="flex items-center gap-2 px-3 py-1.5 bg-[#0891b2] text-white rounded-lg hover:bg-[#067a96] transition-colors text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      New Consultation
    </button>
  </div>

  <!-- Stats Cards -->
  <div class="mb-2">
    <app-patient-stats-card></app-patient-stats-card>
  </div>

  <!-- Main Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Left Column (Calendar + Vitals) -->
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-teal-50">
        <h2 class="text-md font-semibold text-[#134e4a] mb-2">Today's Appointments</h2>
        <app-appointment-calendar></app-appointment-calendar>
      </div>
      
      <div class="bg-white p-4 rounded-xl shadow-sm border border-teal-50">
        <h2 class="text-md font-semibold text-[#134e4a] mb-2">Live Patient Vitals</h2>
        <app-vital-signs-chart></app-vital-signs-chart>
      </div>
    </div>

    <!-- Right Column (Activity Feed) -->
    <div class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-teal-50 h-full">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-md font-semibold text-[#134e4a]">Recent Activity</h2>
          <button class="text-xs text-[#0891b2] hover:text-[#067a96] font-medium">View All</button>
        </div>
        <app-recent-activity-feed></app-recent-activity-feed>
      </div>
    </div>
  </div>
</div>
