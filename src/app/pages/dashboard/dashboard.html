<div class="space-y-4">
  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
    <div>
      <h1 class="text-xl font-bold text-text">Dashboard Overview</h1>
      <p class="text-xs text-text-muted">Welcome back, Dr. Jenkins.</p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="mb-2">
    <app-patient-stats-card></app-patient-stats-card>
  </div>

  <!-- Main Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Left Column (Calendar + Vitals) -->
    <div class="lg:col-span-2 space-y-4">
      <div class="bg-surface p-4 rounded-xl shadow-sm border border-card-border">
        <h2 class="text-md font-semibold text-text mb-2">Today's Appointments</h2>
        <app-appointment-calendar></app-appointment-calendar>
      </div>
      
      <div class="bg-surface p-4 rounded-xl shadow-sm border border-card-border">
        <h2 class="text-md font-semibold text-text mb-2">Live Patient Vitals</h2>
        <app-vital-signs-chart></app-vital-signs-chart>
      </div>
    </div>

    <!-- Right Column (Activity Feed) -->
    <div class="space-y-4">
      <div class="bg-surface p-4 rounded-xl shadow-sm border border-card-border h-full">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-md font-semibold text-text">Recent Activity</h2>
          <button class="text-xs text-[#0891b2] hover:text-[#067a96] font-medium">View All</button>
        </div>
        <app-recent-activity-feed></app-recent-activity-feed>
      </div>
    </div>
  </div>
</div>
